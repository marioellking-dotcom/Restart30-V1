<style>
:root{--bg:#f2f7f4;--card:#fff;--ink:#12302f;--mut:#566d6b;--pri:#0e7c7b;--on:#fff;--acc:#e8962e;--bad:#b3402f;--line:#d3e2de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:18px}

h1{font-size:2.2rem;margin:.3em 0 .1em}h2{font-size:1.5rem;margin:.2em 0 .4em}.big{font-size:1.35rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card p{margin:.4em 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-weight:600;cursor:pointer;margin:0 0 12px;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}

label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.warn{border-left:5px solid var(--bad)}
.mut,.tag{color:var(--mut)}.tag{font-size:.82rem}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px}.item b{display:block}
.ok{color:var(--pri);font-weight:700}
.c{text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mut);cursor:pointer}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.orb{width:190px;height:190px;margin:26px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc),var(--pri));transform:scale(.6);transition:transform 4s ease-in-out}
.sc{display:flex;gap:6px}.sc button{flex:1;padding:12px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.sc button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
ol{padding-left:1.2em}li{margin:.5em 0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.hero,.stage{background:linear-gradient(160deg,#0f4a3c,#092a24);color:#e8f6ee;border-radius:18px;padding:16px;margin:0 0 14px}.hero p,.stage p{margin:.3em 0}.hr{display:flex;gap:14px;align-items:center;text-align:left}.t2{color:#a9d8c0;font-size:.9rem}.week{display:flex;justify-content:space-between;margin-top:14px}.week span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#a9d8c0;font-size:.85rem}.week .on{background:#6be59a;color:#07271f;font-weight:700}.week .tdy{outline:2px solid #6be59a;outline-offset:2px}.ib{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}.gr{flex:1}.glow{width:230px;height:230px;margin:14px auto;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 14px rgba(107,229,154,.1),0 0 0 30px rgba(107,229,154,.05)}.glow .orb{margin:0}.fig{width:170px;height:200px}.fig *{stroke:#6be59a;stroke-width:8;stroke-linecap:round;fill:none}.fig circle{fill:#ffb347;stroke:none}.fig .tr{stroke-width:13}.fig .ar line,.fig .lr line{stroke:#2fb36b}.bd{transform-origin:60px 128px}.bd2{transform-origin:60px 120px;animation:br 4s ease-in-out infinite}.bd,.al,.ar,.ll,.lr{animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}@keyframes sw{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}@keyframes lift{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(60deg) scaleY(.7)}}@keyframes ring{to{transform:rotate(360deg)}}@keyframes dn{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}@keyframes lg{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes lean{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-20deg)}}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.walk .ll,.walk .ar{animation-name:sw}.walk .lr,.walk .al{animation-name:sw;animation-delay:-1.2s}.march .ll{animation-name:lift}.march .lr{animation-name:lift;animation-delay:-1.2s}.mob .al,.mob .ar{animation-name:ring;animation-duration:4s;animation-timing-function:linear}.mob .ar{animation-direction:reverse}.sit .bd{animation-name:dn}.sit .ll,.sit .lr{animation-name:lg}.sit .al,.sit .ar{transform:rotate(85deg)}.wall .bd{animation-name:lean}.wall .al,.wall .ar{transform:rotate(95deg)}.stretch .bd{animation-name:tilt}.stretch .al,.stretch .ar{transform:rotate(170deg)}@media(prefers-reduced-motion:reduce){.fig g{animation:none!important}}@keyframes ups{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}@keyframes prs{0%,100%{transform:rotate(100deg)}50%{transform:rotate(175deg)}}@keyframes crl{0%,100%{transform:rotate(0)}50%{transform:rotate(135deg)}}@keyframes cf{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ups .al,.ups .ar{animation-name:ups}.press .al,.press .ar{animation-name:prs}.crl .al,.crl .ar{animation-name:crl}.calf .bd{animation-name:cf}nav button{font-size:.8rem}.chips{margin-bottom:14px}:root{--bg:#eef5f1;--card:#ffffff;--ink:#0e2a26;--mut:#587570;--pri:#08805f;--on:#ffffff;--acc:#f4a63a;--bad:#c8432f;--line:#d9e8e1}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07211c;--card:#0f3029;--ink:#e9f7f1;--mut:#97b8ae;--pri:#4fe08f;--on:#04231a;--acc:#ffb84d;--bad:#ff8f7a;--line:#1b4a3f}}:root[data-theme=dark]{--bg:#07211c;--card:#0f3029;--ink:#e9f7f1;--mut:#97b8ae;--pri:#4fe08f;--on:#04231a;--acc:#ffb84d;--bad:#ff8f7a;--line:#1b4a3f}body{background-color:var(--bg);background-image:radial-gradient(90% 45% at 50% -8%,rgba(79,224,143,.18),transparent 65%);background-repeat:no-repeat;padding-bottom:110px}h1,h2,.big{font-family:system-ui,'Segoe UI',Roboto,sans-serif;font-weight:800;letter-spacing:-.02em}h1{font-size:2.5rem;margin:.2em 0}h2{font-size:1.7rem}.card{border-radius:20px;box-shadow:0 6px 18px rgba(8,40,32,.08)}.btn{border-radius:999px;padding:16px;box-shadow:0 8px 20px rgba(8,128,95,.25)}.btn.sec{box-shadow:none}.btn.sos{background:linear-gradient(135deg,#ffb84d,#ff8a3d);color:#2a1500;box-shadow:0 8px 20px rgba(255,138,61,.3)}.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px}.hero::after{content:'';position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(79,224,143,.35),transparent 70%);pointer-events:none}.stage{border-radius:26px;background:radial-gradient(80% 70% at 50% 0%,#14614c,#08261f);padding:18px 12px}.week span{width:40px;height:40px;font-weight:600}.chip{padding:11px 16px;font-weight:600}input,select,textarea{border-radius:14px;padding:14px}.ib{background:linear-gradient(135deg,rgba(79,224,143,.25),rgba(79,224,143,.06))}ol{list-style:none;padding:0;counter-reset:s}ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;text-align:left}ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:.85rem}nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:28px;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.2)}nav button{padding:8px 2px;border-radius:22px;font-size:.7rem;box-shadow:none}nav button.on{background:rgba(79,224,143,.18);box-shadow:none;color:var(--pri)}nav button i{display:block;font-style:normal;font-size:1.3rem;line-height:1.2}.rig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}.rig polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}.rig .rn{stroke:#6be59a;stroke-width:7}.rig .rf{stroke:#2e9c68;stroke-width:7}.rig .tr{stroke:#3fc486;stroke-width:12}.rig .hd{fill:#ffb84d}.rig .wt{fill:#ffb84d;stroke:#7a4a00;stroke-width:2}.rig .gd{stroke:rgba(255,255,255,.25);stroke-width:2}.rig .ch{stroke:rgba(255,255,255,.45);stroke-width:4;fill:rgba(255,255,255,.35)}.cn{text-align:center;margin:0 0 12px}.cn b{display:block;font-size:3.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.cn span{color:var(--mut);font-size:.95rem}.rig{cursor:grab;touch-action:none}.sup a{color:var(--pri);font-weight:700}

<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let S={p:null,start:null,done:{},ci:{},note:{},ct:{n:'',t:'',e:''}},V='welcome',A=null,G=[],T=[],Cf=null;
try{const x=localStorage.getItem('r30');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('r30',JSON.stringify(S))}catch(e){}};
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayN=()=>Math.max(1,Math.floor((new Date(td())-new Date(S.start))/864e5)+1);
const gate=()=>S.p.g.includes('rec')&&['alc','cal','opi'].includes(S.p.sub);
const lvl=()=>{let l=S.p.act;const b=bmi();if(S.p.age>=50||S.p.g.includes('dig')||b>=30||(b&&b<18.5))l=Math.min(l,1);return gate()?0:l};
const clr=()=>{T.forEach(clearTimeout);T=[];try{speechSynthesis.cancel()}catch(e){}};
const W={gate:'Parar de repente álcool, calmantes ou opioides pode ser perigoso. Antes de parar ou reduzir, fala com um profissional de saúde. Se tiveres tremores fortes, confusão, alucinações ou convulsões, procura urgência já. Até teres orientação, o teu plano fica só com actividades leves.',
dig:'O plano usa actividades leves, sem esforço no abdómen. Procura urgência se vomitares sangue, tiveres fezes pretas ou dor forte e contínua. Fala com um profissional de saúde se os sintomas persistirem.',
urg:'Procura ajuda médica agora: vai à unidade sanitária mais próxima ou liga para o serviço de emergência da tua zona. Sintomas graves: vómito com sangue, fezes pretas, convulsões, confusão, alucinações, dor forte no peito ou pensamentos de te magoares.'};
const EX={
walk:{t:'Corpo',n:'Caminhada leve',m:15,s:['Caminha a um ritmo em que consigas falar sem esforço.','Mantém os ombros soltos e respira com calma.','Termina com 1 minuto mais devagar.']},
mob:{t:'Corpo',n:'Mobilidade de pescoço e ombros',m:4,s:['Sentado ou de pé, roda os ombros 10 vezes para trás.','Inclina a cabeça devagar para cada lado e mantém 5 segundos.','Sobe e baixa os ombros 10 vezes.']},
sit:{t:'Corpo',n:'Sentar e levantar',m:6,s:['Senta-te na ponta de uma cadeira firme.','Levanta-te devagar, de preferência sem usar as mãos.','Volta a sentar com controlo. Faz {r} repetições, descansa 1 minuto e repete.']},
march:{t:'Corpo',n:'Marcha no lugar',m:5,s:['De pé, junto a uma parede ou cadeira para te apoiares.','Levanta um joelho de cada vez, em ritmo calmo.','Faz {r} vezes cada perna, descansa e repete 2 vezes.']},
wall:{t:'Corpo',n:'Flexões na parede',m:5,s:['De frente para a parede, apoia as mãos à altura dos ombros.','Dobra os cotovelos e aproxima o peito da parede.','Empurra de volta. Faz {r} repetições, descansa e repete 2 vezes.']},
stretch:{t:'Corpo',n:'Alongamento de pernas e costas',m:6,s:['Sentado, estica uma perna e inclina o tronco devagar até sentires alongar. Mantém 20 segundos.','Troca de perna.','De pé, entrelaça as mãos e estica os braços para cima durante 20 segundos.']},
brea:{t:'Mente',n:'Respiração guiada',m:2,b:1},
surf:{t:'Mente',n:'Surfar o desejo',m:8,s:['Senta-te e repara onde sentes a vontade no corpo.','Dá-lhe uma nota de 0 a 10 e respira devagar.','Observa-a como uma onda: sobe, chega ao pico e desce. Não precisas de agir.','Passados alguns minutos, dá-lhe outra nota. O que mudou?']},
relax:{t:'Mente',n:'Relaxamento muscular',m:6,s:['Deita-te ou senta-te confortavelmente.','Aperta os punhos durante 5 segundos e solta devagar.','Repete com os braços, os ombros, a cara e as pernas.','No fim, respira com calma.']},
diary:{t:'Mente',n:'Diário de 3 linhas',m:4,d:1,s:['Escreve como te sentes agora.','Escreve uma coisa que conseguiste hoje.','Escreve um passo pequeno para amanhã.']},
water:{t:'Hábito',n:'Água e refeições regulares',m:2,s:['Bebe água aos poucos ao longo do dia.','Faz refeições pequenas e a horas regulares.','Repara no que te faz mal e fala sobre isso com um profissional de saúde.']},
sleep:{t:'Hábito',n:'Hora fixa para dormir',m:2,s:['Escolhe uma hora para deitares e outra para acordares.','Mantém-nas durante a semana toda.','Hoje, deita-te à hora combinada.']},
screen:{t:'Hábito',n:'Descansar dos ecrãs antes de dormir',m:2,s:['30 minutos antes de dormir, afasta o telemóvel.','Faz algo calmo: alongar, ler ou respirar.','Deixa o telemóvel longe da cama.']}};
function plan(d){const l=lvl();let f=l?['walk','mob','sit','march','wall','stretch']:['mob','walk','stretch'];if(S.p.g.includes('dig'))f=f.filter(x=>x!='wall');
const m=S.p.g.includes('rec')?['surf','brea','relax','diary']:['brea','relax','diary'];
return[f[(d-1)%f.length],m[(d-1)%m.length],['water','sleep','screen'][(d-1)%3]]}
const GO=[['fit','Condição física'],['str','Stress e ansiedade'],['slp','Sono'],['rec','Apoio na recuperação de substâncias'],['dig','Bem-estar digestivo (gastrite)']],
SB=[['','Prefiro não dizer'],['alc','Álcool'],['cal','Calmantes (benzodiazepinas)'],['opi','Opioides'],['can','Cannabis'],['tab','Tabaco'],['out','Outra']],
Q=[['hu','Como te sentes hoje?','1 mal, 5 muito bem'],['sl','Como dormiste?','1 mal, 5 muito bem'],['st','Nível de stress','1 baixo, 5 alto'],['cr','Vontade de consumir','1 nenhuma, 5 muito forte']];
const nav=()=>'<nav>'+[['today','<i>🏠</i>Hoje'],['mus','<i>💪</i>Treinos'],['ci','<i>✅</i>Check-in'],['prog','<i>📈</i>Progresso'],['help','<i>🛟</i>Ajuda']].map(([v,t])=>`<button data-a="go" data-v="${v}" class="${V==v?'on':''}">${t}</button>`).join('')+'</nav>';
const bk='<button class="lnk" data-a="go" data-v="today">Voltar</button>';
function welcome(){return`<main><h1>RESTART 30</h1><p class="big">Recomeça hoje. Transforma o teu amanhã.</p><div class="card"><p>Um plano diário simples para criar hábitos mais saudáveis durante 30 dias e acompanhar a tua evolução. Os resultados variam de pessoa para pessoa.</p><p>Esta app apoia o teu bem-estar. Não substitui médicos, psicólogos nem tratamento para dependências.</p><p>Os teus dados ficam só neste dispositivo.</p></div><button class="btn" data-a="go" data-v="fm">Começar</button></main>`}
function fm(){return`<main><h2>Vamos conhecer-te</h2><div class="card"><label>Idade<input id="age" type="number" inputmode="numeric" min="12" max="99"></label><div class="row"><label>Peso em kg (opcional)<input id="kg" type="number" inputmode="decimal"></label><label>Altura em cm (opcional)<input id="cm" type="number" inputmode="numeric"></label></div><label>Actividade física actual<select id="act"><option value="0">Pouca</option><option value="1">Alguma</option><option value="2">Muita</option></select></label></div><div class="card"><b>O que queres melhorar?</b><div class="chips">${GO.map(([k,t])=>`<button type="button" class="chip${G.includes(k)?' on':''}" data-a="chip" data-k="${k}">${t}</button>`).join('')}</div><label id="sbw" hidden style="margin-top:12px">Que substância? (opcional)<select id="sub">${SB.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label></div><div id="wn"></div><p id="er" class="mut" role="alert"></p><button class="btn" data-a="mk">Criar o meu plano</button></main>`}
function upd(){const r=G.includes('rec'),s=$('#sub').value;$('#sbw').hidden=!r;let h='';
if(r&&['alc','cal','opi'].includes(s))h+=`<div class="card warn"><b>Atenção</b><p>${W.gate}</p></div>`;
if(G.includes('dig'))h+=`<div class="card warn"><b>Gastrite</b><p>${W.dig}</p></div>`;$('#wn').innerHTML=h}
function today(){const d=dayN(),dn=S.done[td()]||[];
return`<main><h2>${d>30?'Completaste os 30 dias':'Dia '+d+' de 30'}</h2><p class="mut">${d>30?'Continua com o plano ou reinicia em Ajuda.':'Faz o que conseguires hoje. Cada passo conta.'}</p>${gate()?`<div class="card warn"><b>Atenção</b><p>${W.gate}</p></div>`:''}${S.p.g.includes('dig')?`<div class="card warn"><b>Gastrite</b><p>${W.dig}</p></div>`:''}${S.p.g.includes('rec')?'<button class="btn sos" data-a="go" data-v="sos">Estou com vontade de consumir</button>':''}${plan(d).map(id=>`<div class="card item"><div><span class="tag">${EX[id].t}, ${EX[id].m} min</span><b>${EX[id].n}</b></div>${dn.includes(id)?'<span class="ok">Feito</span>':`<button class="btn" style="width:auto;margin:0;padding:10px 16px" data-a="op" data-id="${id}">Fazer</button>`}</div>`).join('')}</main>`}
function ac(){const e=EX[A],r=6+2*lvl()+Math.min(Math.ceil(dayN()/7),4);
if(e.b)return`<main class="c">${bk}<h2>${e.n}</h2><div id="orb" class="orb"></div><p id="ph" class="big" aria-live="polite">Senta-te com as costas direitas</p><button class="btn sec" data-a="br">Começar (cerca de 1 minuto)</button><button class="btn" data-a="fin">Marcar como feito</button></main>`;
return`<main>${bk}<h2>${e.n}</h2><p class="mut">Cerca de ${e.m} minutos</p><ol>${e.s.map(s=>`<li>${s.replace('{r}',r)}</li>`).join('')}</ol>${e.d?`<textarea id="dy" rows="4" placeholder="Escreve aqui">${esc(S.note[td()])}</textarea>`:''}${e.t=='Corpo'?'<p class="mut">Pára se sentires dor forte, tontura, falta de ar ou dor no peito.</p>':''}<button class="btn" data-a="fin">Marcar como feito</button></main>`}
function ci(){const c=S.ci[td()]||{};

function prog(){const dd=Object.keys(S.done).filter(k=>S.done[k].length).length,ks=Object.keys(S.ci).sort(),

n class='btn' data-a='fin'>Marcar como feito</button></main>`}function sm(){return`<main class='c'><div class='hero'><div class='big'>Bom trabalho!</div><p class='t2'>${EX[A].n} concluído. Cada passo conta.</p>${wk()}<p class='t2'>Dias ativos: ${nd()} de 30</p></div>${EX[A].t=='Corpo'?sup():''}<button class='btn' data-a='go' data-v='today'>Continuar</button></main>`}function breathe(){clr();const o=$('#orb'),p=$('#ph'),m=$('#tm');let t=0,R=72;for(let i=0;i<6;i++){[['Inspira',4,1],['Pausa',2,1],['Expira',6,.6]].forEach(([n,s,z])=>{T.push(setTimeout(()=>{p.textContent=n;if(S.v)say(cu(n));o.style.transitionDuration=s+'s';o.style.transform='scale('+z+')'},t*1000));t+=s})}T.push(setInterval(()=>{R=Math.max(0,R-1);m.textContent=Math.floor(R/60)+':'+String(R%60).padStart(2,'0')},1000));T.push(setTimeout(()=>{p.textContent='Muito bem. Podes terminar.'},t*1000))}const bmi=()=>{const k=+S.p.kg,c=+S.p.cm/100;return k>0&&c>0?k/(c*c):0};const rp=()=>6+2*lvl()+Math.min(Math.ceil(dayN()/7),4);const say=t=>{try{const y=speechSynthesis,L=t.length>40?(String(S.lg).startsWith('pt')?S.lg:'pt-PT'):(S.lg||'pt-PT'),vs=y.getVoices(),u=new SpeechSynthesisUtterance(t),v=vs.find(x=>x.lang.replace('_','-').toLowerCase()==L.toLowerCase())||vs.find(x=>x.lang.toLowerCase().startsWith(L.slice(0,2).toLowerCase()));y.cancel();if(v)u.voice=v;u.lang=L;u.rate=.9;y.speak(u)}catch(e){}};let MG='pe';const MS={om:['Ombros',[['Elevação lateral com garrafas','ups','Segura uma garrafa de água em cada mão, braços ao lado do corpo.|Sobe os braços de lado até à altura dos ombros, sem balançar.|Desce devagar. Faz {r} repetições, descansa 1 minuto e repete 2 vezes.'],['Press de ombros com garrafas','press','Com as garrafas à altura dos ombros, costas direitas.|Empurra para cima até esticar os braços, sem arquear as costas.|Desce com controlo. Faz {r} repetições, descansa e repete 2 vezes.'],['Círculos de braços','mob','De pé, braços abertos à altura dos ombros.|Faz círculos pequenos para a frente durante 15 segund
